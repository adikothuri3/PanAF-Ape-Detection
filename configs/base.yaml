# Phase 1 baseline configuration.
#
# All relative paths resolve against the repository root, not your shell's
# working directory. Unknown keys are rejected: if you add a key here you must
# also add it to the matching pydantic model in src/panaf_ape_detection/config.py.
#
# Never put credentials or access tokens in this file. See .env.example.

project:
  name: panaf-ape-detection
  seed: 42
  experiment_name: phase1-baseline

paths:
  raw_data_dir: data/raw
  interim_data_dir: data/interim
  processed_data_dir: data/processed
  artifacts_dir: artifacts

data:
  # Created by you from data/sample_manifest.example.csv once clips are chosen.
  manifest_path: data/sample_manifest.csv
  # Phase 1 deliberately works on a small, hand-picked sample. The manifest
  # holds 10 clips; this must not cap it below that, or a "full run" silently
  # leaves clips out.
  max_clips: 10
  # 1 = every decoded frame. Raise this to sample frames on slow hardware.
  frame_stride: 1

model:
  framework: pytorch-wildlife
  model_name: MegaDetectorV6
  # The exact weight variant is recorded with every run. Do not remove it or
  # rely on an upstream default. See docs/obsidian/05 Technical/model.md for the recognised set.
  # MDV6-yolov10-e since 2026-07-27. Measured head-to-head against MDV6-yolov9-c
  # at the same threshold: recall 0.386 -> 0.745 at unchanged precision. Costs
  # ~22% more compute. See reports/variant_comparison_2026-07-27.md.
  variant: MDV6-yolov10-e
  # 0.05, and deliberately not the threshold that maximises single-frame
  # accuracy. Measured over all 500 PanAf500 clips (201,430 annotated boxes):
  #
  #   conf   0.05    0.20    0.30    0.40    0.50    0.70
  #   F1    0.621   0.793   0.825   0.835   0.825   0.762
  #
  # Detection alone peaks at 0.40 (F1 0.835) -- not 0.20, which this file claimed
  # until it was checked against the full dataset. That figure came from 10
  # purposively-hard clips *and* from a run with tracking on, so drop_short_tracks
  # had already deleted false positives before the detector was scored.
  #
  # The pipeline is not a detector, though, and what it produces is better than
  # any single threshold can be. Tracked output over the same 500 clips:
  #
  #   detect 0.20 + the pre-2026-07-28 tracker   P 0.794  R 0.850  F1 0.821
  #   detect 0.05 + the tracker below            P 0.855  R 0.859  F1 0.857
  #
  # Better on precision *and* recall, and above the 0.835 ceiling of the best
  # possible threshold. The tracker discriminates using temporal consistency,
  # which a per-frame threshold has no access to: a false positive at 0.15 is
  # one frame of flicker and is discarded, while a real ape at 0.15 between two
  # confident frames is absorbed into the track it belongs to.
  #
  # So detect generously and let the tracker filter. Boxes below this are never
  # written to disk, which is the other reason to keep it low: anything above
  # 0.05 can be recovered later for free, and nothing below it ever can.
  confidence_threshold: 0.05
  # auto | cpu | cuda | mps
  #
  # POLICY: inference never runs on CPU. `cpu` is a valid value to the schema but
  # the detector refuses it (runtime.require_accelerator) -- a CPU run does not
  # fail, it just costs hours, which is worse. `auto` picks CUDA, then Apple MPS,
  # and raises if neither exists. If this machine has no accelerator, run on a
  # Colab GPU: notebooks/phase1_colab.ipynb.
  device: auto

tracking:
  # ByteTrack, via supervision -- no new dependency, and its second association
  # pass over low-confidence boxes targets exactly the detector flicker this
  # baseline produces. See docs/obsidian/05 Technical/architecture.md.
  # Chosen by a 72-arm sweep over all 500 clips, ranked by identity coverage and
  # held to a hard ceiling on merged tracks. Against the settings that shipped
  # before 2026-07-28, over 874 annotated individuals:
  #
  #                          before    after
  #   identity coverage      0.7397   0.8230
  #   ID switches              2257      301
  #   fragmentation            2.48     1.27
  #   tracks holding 2+ apes     57       56
  #   jitter                 0.0153   0.0035
  #   mostly tracked        625/874  645/874
  #   mostly lost            65/874   74/874
  #
  # Nine more apes end up mostly-lost. That is the cost of the strict activation
  # threshold below, and it is real: a faint animal now never gets a track
  # started at all. See reports/phase1_findings_2026-07-28.md.
  enabled: true
  backend: bytetrack
  # 8 frames, a third of a second. Affordable only because activation is high:
  # there is far less flicker left for it to remove. At the old settings this
  # value deleted true positives.
  minimum_track_length: 8
  # 0.45, decoupled from model.confidence_threshold and nine times it. The single
  # largest effect in the sweep.
  #
  # Two upstream literals in supervision constrain this, and neither is
  # configurable: detections scoring <= 0.10 are discarded before either
  # association pass, and a NEW track needs a detection scoring above
  # activation + 0.10. So starting a track here takes a 0.55 box, while anything
  # down to score_floor can still *extend* one. Only a confident detection opens
  # an identity; faint ones continue an existing animal. Spurious track creation
  # was the main source of fragmentation.
  activation_threshold: 0.45
  # 120 at 30 fps = 96 frames = 4.0 s at PanAf's 24 fps (supervision rescales by
  # `int(fps / 30 * buffer)`). Long enough that the tracker's own motion model
  # reconnects the gaps offline stitching was written to repair, which is why
  # stitch_max_gap below is 0.
  lost_track_buffer: 120
  # 0.8, and NOT the 0.9 that a 10-clip sweep preferred. This is the knob that
  # drives merged tracks, by a wide margin -- mean merged tracks across the 500-
  # clip sweep were 46.7 at 0.7, 54.9 at 0.8, and 71.9 at 0.9. Permissive
  # association, not a long memory, is what fuses two animals into one identity.
  minimum_matching_threshold: 0.8
  # 1, i.e. off. It helped a great deal before activation was raised (ID switches
  # 46 -> 18 on its own, on the 10-clip sample) but it costs coverage, and once
  # activation is doing the work it earns nothing.
  minimum_consecutive_frames: 1
  # Works around supervision's hardcoded `scores > 0.1`, which silently discards
  # 18.6% of detections at this confidence threshold -- by the low-score
  # association pass that is the entire reason ByteTrack was chosen. Scores are
  # mapped into [0.11, 1] before association and mapped back before anything is
  # written, so no artifact ever records a rescaled score.
  score_floor: 0.11
  # 0, i.e. off -- a result, not an oversight. Stitching works: on the untuned
  # baseline it cuts tracks 59 -> 46 and fragmentation 2.57 -> 2.00. It changes
  # nothing at these settings, because lost_track_buffer already reconnects the
  # same fragments, with a motion model rather than a repair afterwards.
  stitch_max_gap: 0
  stitch_max_distance: 1.0
  # Fill interior gaps up to one second. The only mechanism that can lift
  # coverage above detection recall, and it costs almost nothing in precision
  # because the synthesised boxes land on real apes. Every one is flagged
  # `interpolated` in the artifacts, so Phase 2 can exclude boxes no detector saw.
  interpolate_max_gap: 24
  # Five-frame centred average. Cuts jitter by 77% and slightly *raises*
  # precision and recall, because steadier boxes clear the IoU 0.5 threshold
  # more often.
  smooth_window: 5

video:
  output_fps: 24.0
  codec: mp4v
  draw_confidence: true
  draw_track_id: true
  draw_behavior_label: true

logging:
  level: INFO
  save_run_metadata: true
