# Candidate tracking settings — NOT YET ADOPTED.
#
# These came out of a staged sweep over the 10-clip sample (see
# experiments/experiment_log.md, 2026-07-27). They are recorded here rather than
# merged into base.yaml for one reason: **they were tuned and measured on the
# same 10 clips.** That is exactly the circumstance under which a tuned result
# means least, and those 10 clips were purposively chosen to be hard, so they are
# not a random sample of anything either.
#
# Promote this into base.yaml and colab.yaml only after confirming it on clips it
# was never tuned on -- configs/colab-full500.yaml exists to produce them, and
# the dataset's own train/validation/test split is what to divide by.
#
# Measured on the 10-clip detector-only cache at confidence 0.05
# (artifacts/colab/variant-yolov10e/), against the same cache tracked with the
# settings that were shipped before this work:
#
#                        shipped    candidate
#   identity coverage     0.6449      0.7561
#   coverage              0.7284      0.7639
#   ID switches              46           4
#   fragmentation          2.57        1.13
#   track purity         0.9963      0.9975
#   tracks holding 2+ apes    3           2
#   jitter               0.0230      0.0042
#   mostly tracked        13/23       16/23
#   detection precision  0.9530      0.9556
#   detection recall     0.7246      0.7639
#
# Nothing here is a code change to the tracker's algorithm; it is configuration
# plus two post-processing steps that are measured like any other prediction.

project:
  name: panaf-ape-detection
  seed: 42
  experiment_name: tracking-candidate

paths:
  raw_data_dir: data/raw
  interim_data_dir: data/interim
  processed_data_dir: data/processed
  artifacts_dir: artifacts/tracking-candidate

data:
  manifest_path: data/sample_manifest.csv
  max_clips: 500
  frame_stride: 1

model:
  framework: pytorch-wildlife
  model_name: MegaDetectorV6
  variant: MDV6-yolov10-e
  # Deliberately permissive. The finding behind the whole candidate is that it
  # is better to detect generously and let the tracker discard the junk than to
  # threshold hard up front: raw precision at 0.05 is 0.64, but the *tracked*
  # output is 0.9556 — better than the 0.9308 the 0.20 pipeline reported, with
  # higher recall as well.
  confidence_threshold: 0.05
  device: auto

tracking:
  enabled: true
  backend: bytetrack

  # A track must survive 8 frames (a third of a second) to be kept at all.
  # Affordable now only because activation is high: there is far less flicker
  # left for it to remove.
  minimum_track_length: 8

  # 0.40, twice the detector threshold and decoupled from it for the first time.
  # The single largest effect in the sweep. supervision needs activation + 0.10
  # to *start* a track, so this means only a 0.50 detection opens a new identity,
  # while everything down to the score floor can still extend an existing one.
  # Spurious track creation was the main source of fragmentation.
  activation_threshold: 0.40

  # 120 at 30 fps = 96 frames = 4.0 s at PanAf's 24 fps. Long enough that the
  # tracker's own motion model bridges the gaps that offline stitching was built
  # to repair -- which is why stitch_max_gap below is 0.
  lost_track_buffer: 120

  # More permissive association than the 0.8 default.
  minimum_matching_threshold: 0.9

  # 1, i.e. off. Requiring consecutive frames helped a lot before activation was
  # raised (switches 46 -> 18 on its own) but costs coverage, and once activation
  # is doing the work it is no longer needed.
  minimum_consecutive_frames: 1

  # Works around supervision's hardcoded `scores > 0.1`, which silently discards
  # 18.6% of detections at this confidence threshold. Scores are mapped into
  # [0.11, 1] before association and mapped back before anything is written, so
  # no artifact ever reports a rescaled score.
  score_floor: 0.11

  # 0, i.e. off -- and this is a result, not an oversight. Stitching works: on
  # the untuned baseline it cuts tracks 59 -> 46 and fragmentation 2.57 -> 2.00.
  # At these settings it changes nothing at all, because lost_track_buffer 120
  # already reconnects the same fragments, and does it with a motion model
  # instead of after the fact.
  stitch_max_gap: 0
  stitch_max_distance: 1.0

  # Fill interior gaps up to 1 second. The only mechanism that can lift coverage
  # above detection recall, and it costs almost nothing in precision
  # (0.9530 -> 0.9528 before smoothing) because the synthesised boxes land on
  # real apes. Every one is flagged `interpolated` in the artifacts.
  interpolate_max_gap: 24

  # Five-frame centred average. Cuts jitter by 82% and slightly *raises*
  # precision and recall, because steadier boxes clear the IoU 0.5 threshold
  # more often.
  smooth_window: 5

video:
  output_fps: 24.0
  codec: mp4v
  draw_confidence: true
  draw_track_id: true
  draw_behavior_label: true
  write_annotated: true

logging:
  level: INFO
  save_run_metadata: true
