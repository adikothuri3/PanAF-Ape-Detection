# Google Colab variant of configs/base.yaml.
#
# Differences from the baseline:
#   * device is pinned to cuda, since a Colab GPU runtime is assumed
#     (Runtime -> Change runtime type -> GPU). Note that PyTorch-Wildlife
#     ignores the device argument; the adapter forces and verifies it.
#   * the full sample runs at every frame -- an A100 gets through 10 clips in a
#     few minutes (a T4 in roughly ten), so there is no reason to subsample and
#     end up comparing a partial run against a full one.
#
# Paths are still repository-relative. If you keep the dataset on Google Drive,
# point paths.raw_data_dir at the mounted location, e.g.
#   raw_data_dir: /content/drive/MyDrive/panaf/raw

project:
  name: panaf-ape-detection
  seed: 42
  experiment_name: phase1-colab

paths:
  raw_data_dir: data/raw
  interim_data_dir: data/interim
  processed_data_dir: data/processed
  artifacts_dir: artifacts

data:
  manifest_path: data/sample_manifest.csv
  max_clips: 10
  frame_stride: 1

model:
  framework: pytorch-wildlife
  model_name: MegaDetectorV6
  # MDV6-yolov10-e since 2026-07-27. Measured head-to-head against MDV6-yolov9-c
  # over the same 10 clips at the same threshold: recall 0.386 -> 0.745 at
  # unchanged precision (0.874 -> 0.862), and tracking coverage 0.351 -> 0.728.
  # Costs ~22% more compute. It also peaks at the 0.20 threshold below, where
  # yolov9-c did not. See reports/variant_comparison_2026-07-27.md.
  variant: MDV6-yolov10-e
  confidence_threshold: 0.2
  # Colab GPU (A100 preferred; T4 works). Set the runtime *before* running
  # anything: Runtime -> Change runtime type -> GPU. Inference never runs on CPU
  # (see base.yaml), so this fails fast on a CPU runtime rather than for hours.
  device: cuda

tracking:
  # Must match configs/base.yaml -- `make verify` checks the two agree about
  # which pipeline stages run. See base.yaml for what each setting does.
  enabled: true
  backend: bytetrack
  minimum_track_length: 5
  activation_threshold: null
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 1

video:
  output_fps: 24.0
  codec: mp4v
  draw_confidence: true
  draw_track_id: true
  draw_behavior_label: true

logging:
  level: INFO
  save_run_metadata: true
