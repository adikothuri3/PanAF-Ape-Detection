version: 2

# Notes on the uv workflow:
#   * The Python ecosystem here is `uv`, NOT `pip`. The pip ecosystem treats
#     `requirements-colab.txt` as a manifest and opens PRs that edit it directly
#     -- but that file is *generated* from uv.lock, so those PRs create exactly
#     the second source of truth this project avoids. In practice it produced
#     PRs bumping transitive pins (nvidia-*, tomlkit) and one raising
#     `supervision` above the `==0.23.0` that PytorchWildlife requires, which
#     would not have resolved. The `uv` ecosystem reads pyproject.toml and
#     uv.lock instead, which is the actual dependency definition.
#   * Dependabot does not regenerate `requirements-colab.txt`. A Dependabot PR
#     therefore needs `make colab-requirements` run locally and committed to the
#     PR branch, or CI's `lockfile` job will fail. That failure is intentional --
#     it is the reminder.
#   * The `inference` extra is pinned around known-broken upstream releases
#     (see the comments in pyproject.toml). Read those before accepting an
#     update to setuptools, pytorchwildlife, soundfile or librosa.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - python
    # Direct dependencies only -- the ones actually declared in pyproject.toml.
    # Without this, uv.lock's full transitive graph is fair game and Dependabot
    # opens PRs for things like nvidia-cusparse and pydantic-core, which are
    # pulled in by torch and pydantic and are not ours to pin. Transitive
    # versions still move: they move when a direct dependency moves, or when
    # `make lock` is run deliberately.
    allow:
      - dependency-type: direct
    groups:
      # Keep the dev toolchain moving together; these are low-risk and CI covers them.
      dev-tools:
        patterns:
          - ruff
          - mypy
          - pytest*
          - pre-commit
          - types-*
        update-types:
          - minor
          - patch
      # Core runtime deps: grouped, but review individually.
      core:
        patterns:
          - pydantic*
          - typer
          - rich
          - pyyaml
        update-types:
          - minor
          - patch
    ignore:
      # Pinned deliberately: setuptools 81 deprecated and 83 removed
      # `pkg_resources`, which PytorchWildlife's `yolov5` dependency still
      # imports. Unpin only after verifying `import PytorchWildlife` succeeds.
      - dependency-name: setuptools
        versions: [">=81"]
      # Major bumps of the heavy CV stack change numerics and APIs; take these
      # deliberately, with a re-run of the baseline, not via an automated PR.
      - dependency-name: torch
        update-types: [version-update:semver-major]
      - dependency-name: torchvision
        update-types: [version-update:semver-major]
      - dependency-name: pytorchwildlife
        update-types: [version-update:semver-major]
      - dependency-name: numpy
        update-types: [version-update:semver-major]
