name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the inference-smoke job only. The extra depends on packages
    # with a track record of shipping broken metadata; this catches that drift
    # without taxing every push with a multi-gigabyte install.
    - cron: "17 6 * * 1"

# CI deliberately installs the *default* environment only -- no `inference`
# extra. It must never download model weights or PanAf data, never require a
# GPU, and never execute notebooks. If a change makes CI need any of those,
# the change is wrong, not the workflow.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail fast rather than silently resolving something not in the lockfile.
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync the locked environment (no inference extra)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: pytest with coverage
        run: uv run pytest --cov-report=xml --cov-report=term-missing

      - name: Verify repository invariants
        run: uv run python scripts/verify_repository.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  cli-smoke:
    name: CLI works without the inference extra
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A contributor who has only run `uv sync` must still be able to use the
    # basic CLI. This job is what keeps that true.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync the locked environment (no inference extra)
        run: uv sync --frozen

      - name: panaf-phase1 doctor
        run: uv run panaf-phase1 doctor

      - name: panaf-phase1 show-paths
        run: uv run panaf-phase1 show-paths

      - name: panaf-phase1 validate-config (base)
        run: uv run panaf-phase1 validate-config --config configs/base.yaml

      - name: panaf-phase1 validate-config (colab)
        run: uv run panaf-phase1 validate-config --config configs/colab.yaml

      - name: Standalone environment check script
        run: uv run python scripts/check_environment.py

  lockfile:
    name: Lockfile and Colab export are current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      - name: requirements-colab.txt matches uv.lock
        # `uv export` writes the invoking command -- including the -o path -- into
        # a header comment, so the committed file and a copy generated to a
        # different path always differ on that one line. Strip the leading `#`
        # header (indented `    # via` annotations are kept) and compare the rest.
        # The export itself is universal: environment markers are preserved, so
        # the file is identical on Linux and macOS.
        run: |
          uv export --extra inference --no-hashes --no-dev \
            --format requirements-txt -o /tmp/requirements-colab.txt
          if ! diff -u \
              <(grep -v '^#' requirements-colab.txt) \
              <(grep -v '^#' /tmp/requirements-colab.txt); then
            echo "::error::requirements-colab.txt is stale. Run 'make colab-requirements' and commit."
            exit 1
          fi

  inference-smoke:
    name: Inference extra actually works
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scheduled and manual only -- never on push or pull_request. Installing the
    # extra pulls ~190 packages including torch, which is far too slow to tax
    # every commit with. Its purpose is catching *upstream* drift: the extra
    # already carries three workarounds for packages that shipped broken
    # metadata (undeclared soundfile/librosa, and setuptools 83 removing
    # pkg_resources from under yolov5). A `uv lock` that resolves proves none of
    # that still imports.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Sync with the inference extra
        run: uv sync --frozen --extra inference

      - name: Weights-free smoke test
        # Downloads no model weights and needs no GPU. Asserts imports, the
        # MegaDetector API surface, supervision.ByteTrack, NumPy 2.x interop and
        # an OpenCV/imageio video round-trip.
        run: uv run python scripts/smoke_inference.py

      - name: Confirm no model weights were downloaded
        # Scoped deliberately. A naive `find . -name '*.pth'` is a false positive
        # machine: `.pth` is also Python's *path-configuration* extension
        # (_virtualenv.pth, editable installs), and torchmetrics legitimately
        # ships LPIPS weights inside its own package. Check the two places
        # MegaDetector weights would actually land instead.
        run: |
          status=0

          # 1. Any MDV6 weight file anywhere.
          if find / -name 'MDV6*' -not -path '*/proc/*' 2>/dev/null | grep -q .; then
            echo "::error::MegaDetector weights were downloaded; CI must not download them."
            find / -name 'MDV6*' -not -path '*/proc/*' 2>/dev/null
            status=1
          fi

          # 2. Any weight file inside the repository tree itself, excluding the venv.
          if find . -path ./.venv -prune -o \( -name '*.pt' -o -name '*.pth' \) -print \
               | grep -q .; then
            echo "::error::Weight files appeared in the repository tree."
            find . -path ./.venv -prune -o \( -name '*.pt' -o -name '*.pth' \) -print
            status=1
          fi

          # 3. The torch hub cache, which is where PyTorch-Wildlife puts them.
          hub="${TORCH_HOME:-$HOME/.cache/torch}/hub/checkpoints"
          if [ -d "$hub" ] && [ -n "$(ls -A "$hub" 2>/dev/null)" ]; then
            echo "::error::torch hub checkpoint cache is not empty: $hub"
            ls -la "$hub"
            status=1
          fi

          [ "$status" -eq 0 ] && echo "No model weights present, as expected."
          exit "$status"
